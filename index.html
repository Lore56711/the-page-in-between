<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>...</title>


<style>

html, body {
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}


body {
    display:flex;
    justify-content:center;
    align-items:center;
}


#tree {

    width:320px;

    image-rendering:pixelated;
    image-rendering:crisp-edges;

    user-select:none;

    cursor:default;
}


</style>


</head>


<body>


<audio id="music" loop>
    <source src="man.mp3" type="audio/mpeg">
</audio>


<img id="tree" src="tree-hitbox.png" alt="">



<script>


const tree = document.getElementById("tree");
const music = document.getElementById("music");


let clickCount = 0;
let finished = false;
let musicStarted = false;



tree.addEventListener("click", function(){


    // Avvia musica al primo click

    if(!musicStarted){

        music.volume = 1;

        music.play();

        musicStarted = true;

    }



    clickCount++;



    // Primo dialogo

    if(clickCount === 1){


        alert("He is behind the tree.");


    }



    // Secondo dialogo

    else if(clickCount === 2){


        alert("Well, there is a man here.");


        automaticDialog();


    }



    // Dopo la scena

    else if(finished){


        if(clickCount === 3){


            alert("Well, there is not a man here.");


        }


        else if(clickCount >= 4){


            alert("It is a tree.");


        }

    }



});





function automaticDialog(){



    let answer = confirm("He offered you something.");



    if(answer){


        alert("You received an Egg.");


        downloadEgg();



    }

    else{


        alert("Then he needn't be here.");


    }



    finished = true;


}






function downloadEgg(){



    const eggText =
    "Not too important, not too unimportant.";



    const file = new Blob(
        [eggText],
        {type:"text/plain"}
    );



    const link = document.createElement("a");


    link.href = URL.createObjectURL(file);

    link.download = "Egg.txt";



    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);



}



</script>


</body>
</html>
